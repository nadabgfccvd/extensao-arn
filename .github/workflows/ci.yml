name: Arena Ultra compatibility
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extension verification and regression suite
        run: npm run ci
        working-directory: extension
      - name: Agent Kit tests
        run: python3 -m unittest discover -s agent-kit/tests -v
      - name: Pinned release and source parity
        run: python3 scripts/check_release.py
